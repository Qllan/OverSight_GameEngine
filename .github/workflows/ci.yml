name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install pytest mypy pygame-ce pyinstaller
          pip install -e .

      - name: Python tests (including a PyInstaller build of the demo)
        run: pytest
        env:
          VN_ENGINE_TEST_EXPORT: "1"

      - name: Type check
        run: mypy
