name: OverSight 2D release

# Push a tag oversight-v<version> (the version from crates/oversight/Cargo.toml)
# to publish the SDK archives as a GitHub release. Run it by hand to get the
# archives as workflow artifacts without a release.
on:
  push:
    tags: ["oversight-v*"]
  workflow_dispatch:

jobs:
  sdk:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
            python: python
          # The oldest supported runner, so the library runs on older glibc
          - os: ubuntu-22.04
            platform: linux
            python: python3
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: System libraries (sound, gamepads)
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: The tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/oversight/Cargo.toml | head -1)
          test "${GITHUB_REF_NAME}" = "oversight-v${version}" || {
            echo "tag ${GITHUB_REF_NAME} does not match version ${version}"; exit 1; }

      - name: Build and package
        shell: bash
        run: |
          cargo build --release -p oversight
          ${{ matrix.python }} crates/oversight/sdk/package.py --out dist

      - name: Build a game against the SDK
        shell: bash
        run: |
          sdk=$(cd dist/oversight-sdk-*/ && pwd)
          cmake -S crates/oversight/sdk/test -B build/sdk -DCMAKE_PREFIX_PATH="$sdk"
          cmake --build build/sdk --config Release
          ctest --test-dir build/sdk -C Release --output-on-failure
          dotnet run --project crates/oversight/sdk/test-csharp -c Release -p:OverSightSdk="$sdk"

      - uses: actions/upload-artifact@v4
        with:
          name: sdk-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.tar.gz

  release:
    needs: sdk
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        # The release may already exist when it was drafted on the GitHub
        # page together with the tag: then only the archives are added
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "OverSight 2D ${GITHUB_REF_NAME#oversight-v}" \
              --notes "Готовый движок: распакуйте архив и следуйте README.md внутри."
          fi
