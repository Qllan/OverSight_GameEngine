[package]
name = "vn_engine"
version = "0.1.0"
edition = "2021"
description = "Visual Novel Engine - 2D game engine with block-based visual logic"
license = "MIT"

[lib]
name = "vn_engine"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"

[features]
default = []
