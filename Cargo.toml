[package]
name = "vn_engine"
version = "0.1.0"
edition = "2021"
description = "Visual Novel Engine - 2D game engine with block-based visual logic"
license = "MIT"

[lib]
name = "vn_engine"
# cdylib for the Python extension, rlib so `cargo test` can link the crate
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"

[features]
default = []
# Enabled by maturin (see pyproject.toml). Left off for `cargo test`,
# which needs to link against libpython.
extension-module = ["pyo3/extension-module"]

[workspace]
members = [".", "crates/oversight"]
