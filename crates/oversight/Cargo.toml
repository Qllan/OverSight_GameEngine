[package]
name = "oversight"
version = "0.1.0"
edition = "2021"
description = "OverSight 2D: a 2D game runtime with a C API for C++ and C# games"
license = "MIT"

[lib]
name = "oversight"
# cdylib: oversight.dll / liboversight.so for C++ and C#; rlib: Rust tests
crate-type = ["cdylib", "rlib"]

[dependencies]
tiny-skia = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
fontdue = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# sin and cos that give the same bits on every OS (collision shapes)
libm = "0.2"
winit = { version = "0.30", optional = true }
softbuffer = { version = "0.4", optional = true }
gilrs = { version = "0.11", optional = true }
wgpu = { version = "30", optional = true }
pollster = { version = "1", optional = true }
rapier2d = { version = "0.36", optional = true, features = ["enhanced-determinism", "serde-serialize"] }
bincode = { version = "1.3", optional = true }
rodio = { version = "0.23", optional = true, default-features = false, features = ["playback", "wav", "vorbis", "mp3"] }

[features]
default = ["window", "audio", "gamepad", "gpu", "physics"]
window = ["dep:winit", "dep:softbuffer"]
audio = ["dep:rodio"]
gamepad = ["dep:gilrs"]
# Draw with the graphics card (DirectX 12, Vulkan, Metal, OpenGL); the
# software renderer stays for tests, screenshots and machines without one
gpu = ["dep:wgpu", "dep:pollster"]
# Bodies with mass, friction and joints (Rapier, in its deterministic mode)
physics = ["dep:rapier2d", "dep:bincode"]
