[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "vn_engine"
version = "0.1.0"
description = "Visual Novel Engine - 2D game engine with block-based visual logic"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
]
dependencies = []

[project.optional-dependencies]
editor = ["dearpygui>=1.0"]
player = ["pygame-ce>=2.4"]
export = ["pygame-ce>=2.4", "pyinstaller>=6"]
dev = ["pytest>=7.0", "mypy>=1.0"]

[tool.maturin]
features = ["extension-module"]
python-source = "python"
module-name = "vn_engine._core"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["python/vn_engine"]
strict = true

[[tool.mypy.overrides]]
module = ["dearpygui.*", "PyInstaller.*"]
ignore_missing_imports = true
